global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: app01

  - job_name: windows
    static_configs:
      - targets: ['dc01.corp.kurogane.test:9182', 'dc02.corp.kurogane.test:9182']
        labels:
          role: dc
      - targets: ['fs01.corp.kurogane.test:9182']
        labels:
          role: fileserver
      - targets: ['ex01.corp.kurogane.test:9182']
        labels:
          role: exchange
    relabel_configs:
      # instance = short host name instead of "dc01.corp.kurogane.test:9182"
      - source_labels: [__address__]
        regex: '([^.]+)\..*'
        target_label: instance
