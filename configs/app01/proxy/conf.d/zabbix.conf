server {
    listen 443 ssl;
    http2 on;
    server_name zabbix.kurogane-digital.ru;

    ssl_certificate     /etc/nginx/certs/zabbix.crt;
    ssl_certificate_key /etc/nginx/certs/zabbix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # templates are imported as files through the web UI
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s;
    set $zabbix_backend http://zabbix-web:8080;

    location / {
        proxy_pass $zabbix_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
