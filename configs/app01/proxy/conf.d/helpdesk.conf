server {
    listen 443 ssl;
    http2 on;
    server_name helpdesk.kurogane-digital.ru;

    ssl_certificate     /etc/nginx/certs/helpdesk.crt;
    ssl_certificate_key /etc/nginx/certs/helpdesk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # Docker internal DNS: resolve the backend at request time, not only at startup
    resolver 127.0.0.11 valid=30s;
    set $glpi_backend http://glpi:80;

    location / {
        proxy_pass $glpi_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
