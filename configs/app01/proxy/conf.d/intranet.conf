server {
    listen 443 ssl;
    http2 on;
    server_name intranet.kurogane-digital.ru;

    ssl_certificate     /etc/nginx/certs/intranet.crt;
    ssl_certificate_key /etc/nginx/certs/intranet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Docker internal DNS: resolve the backend at request time, not only at startup
    resolver 127.0.0.11 valid=30s;
    set $intranet_backend http://intranet:80;

    location / {
        proxy_pass $intranet_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
